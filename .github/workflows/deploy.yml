name: CI/CD Pipeline

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint
        run: pnpm lint

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run Unit Tests
        run: pnpm test:unit

  build-and-push:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coursely
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rigel-tech/coursely
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          network: host
          build-args: |
            DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/coursely
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Đồng bộ file docker-compose.yml sang VPS
      - name: Copy docker-compose.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: 'docker-compose.yml'
          target: '~/projects/coursely/'

      # Thực thi deploy an toàn và verify trạng thái
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          CR_PAT: ${{ secrets.CR_PAT }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: CR_PAT,GHCR_USERNAME,IMAGE_TAG,ENV_FILE
          script: |
            set -e
            cd ~/projects/coursely

            # Ghi nội dung từ GitHub Secret ra file .env thực tế trên VPS
            echo "$ENV_FILE" > .env

            echo "$CR_PAT" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            export IMAGE_TAG
            docker compose pull app

            # Start service và đợi healthcheck
            docker compose up -d --remove-orphans --wait --wait-timeout 180 app \
              || { echo "=== Deployment Failed: Compose Status & Logs ==="; docker compose ps; docker compose logs --tail=200; exit 1; }

            # Xác minh endpoint phản hồi HTTP 200
            docker compose ps
            curl -fsS --retry 10 --retry-delay 5 http://127.0.0.1:3000/ >/dev/null \
              || { echo "=== App endpoint unreachable: App Logs ==="; docker compose logs --tail=200 app; exit 1; }

            docker image prune -f
